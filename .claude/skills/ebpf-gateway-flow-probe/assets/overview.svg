<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#ffffff"/>

  <text x="30" y="35" font-size="20" font-weight="700" fill="#0f172a">SDN_IoT 网关 eBPF 数据面总览</text>
  <text x="30" y="58" font-size="12" fill="#475569">iot3 命名空间：XDP 入口旁路 + 用户态 probe + 逐包优先级 + qdisc 排队</text>

  <!-- 入口：veth -> XDP -> Python -->
  <rect x="30" y="90" width="150" height="50" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#0f172a">veth / UDP 5005</text>

  <line x1="180" y1="115" x2="238" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="75" width="220" height="85" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="350" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">① XDP</text>
  <text x="350" y="119" text-anchor="middle" font-size="11" fill="#0c4a6e">过滤：非 5005 / 超速 / 非法源</text>
  <text x="350" y="137" text-anchor="middle" font-size="11" fill="#0c4a6e">查 eBPF 缓存</text>

  <line x1="460" y1="115" x2="518" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="489" y="108" text-anchor="middle" font-size="10" fill="#475569">PASS</text>

  <rect x="520" y="75" width="210" height="85" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="625" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">③ Python 网关主流程</text>
  <text x="625" y="119" text-anchor="middle" font-size="11" fill="#14532d">解析 BLE 文本</text>
  <text x="625" y="137" text-anchor="middle" font-size="11" fill="#14532d">算优先级 1–5 / 查 target_ip</text>

  <!-- 未命中旁路 -->
  <line x1="350" y1="160" x2="350" y2="208" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="360" y="188" font-size="10" fill="#6d28d9">未命中 / 过期（旁路事件）</text>

  <rect x="240" y="210" width="220" height="45" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="350" y="237" text-anchor="middle" font-size="12" fill="#581c87">ringbuf 事件</text>

  <line x1="350" y1="255" x2="350" y2="293" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="240" y="295" width="220" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="350" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">② probe（用户态）</text>
  <text x="350" y="339" text-anchor="middle" font-size="11" fill="#4c1d95">查本地缓存 → 写 eBPF 缓存</text>
  <text x="350" y="357" text-anchor="middle" font-size="11" fill="#4c1d95">未命中 → 上报控制器</text>

  <!-- 三张表：控制器表 / 网关本地缓存 / eBPF 缓存 -->
  <rect x="30" y="205" width="150" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="105" y="235" text-anchor="middle" font-size="12" fill="#713f12">eBPF 缓存</text>

  <rect x="30" y="290" width="150" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="105" y="320" text-anchor="middle" font-size="12" fill="#713f12">网关本地缓存</text>

  <rect x="30" y="380" width="150" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="105" y="410" text-anchor="middle" font-size="12" fill="#334155">Ryu 控制器</text>

  <line x1="240" y1="305" x2="182" y2="240" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="196" y="266" font-size="10" fill="#6d28d9">写 READY</text>

  <line x1="240" y1="325" x2="182" y2="318" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="196" y="312" font-size="10" fill="#6d28d9">查本地缓存</text>

  <line x1="240" y1="348" x2="182" y2="400" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="196" y="392" font-size="10" fill="#6d28d9">上报</text>

  <line x1="105" y1="380" x2="105" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="365" font-size="10" fill="#475569">FlowMod</text>

  <line x1="105" y1="290" x2="105" y2="257" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="112" y="278" font-size="10" fill="#475569">同步</text>

  <!-- 出口：Python -> 标记 -> qdisc -> 目标 -->
  <line x1="625" y1="160" x2="625" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="633" y="178" font-size="10" fill="#475569">发送</text>

  <rect x="520" y="190" width="210" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="625" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">④ 逐包贴标签</text>
  <text x="625" y="232" text-anchor="middle" font-size="11" fill="#14532d">SO_PRIORITY / DSCP</text>

  <line x1="625" y1="245" x2="625" y2="273" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="275" width="210" height="65" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="625" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">⑤ 出口 qdisc</text>
  <text x="625" y="317" text-anchor="middle" font-size="11" fill="#7c2d12">band0(5) 先走</text>
  <text x="625" y="332" text-anchor="middle" font-size="11" fill="#7c2d12">band1(4) → band2(1–3)</text>

  <line x1="625" y1="340" x2="625" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="370" width="210" height="50" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="625" y="400" text-anchor="middle" font-size="13" fill="#0f172a">s1 → s2 → h1</text>

  <!-- 图例 -->
  <rect x="30" y="480" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="50" y="492" font-size="11" fill="#334155">XDP：过滤</text>

  <rect x="140" y="480" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="160" y="492" font-size="11" fill="#334155">probe：查表 / 上报</text>

  <rect x="300" y="480" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="492" font-size="11" fill="#334155">Python：决策 / 标记</text>

  <rect x="470" y="480" width="14" height="14" rx="3" fill="#ffedd5" stroke="#ea580c"/>
  <text x="490" y="492" font-size="11" fill="#334155">qdisc：排队</text>

  <rect x="590" y="480" width="14" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="610" y="492" font-size="11" fill="#334155">流表</text>

  <text x="30" y="530" font-size="11" fill="#475569">数据面走实线（包），事件与控制走虚线/旁路。XDP 无论命中与否都返回 PASS，数据不丢。</text>
  <text x="30" y="550" font-size="11" fill="#475569">优先级真正的排队发生在出口 qdisc；eBPF tc 只负责分类、计数、超限丢包（可选）。</text>
  <text x="30" y="570" font-size="11" fill="#b45309">环境：veth / copy 模式，仅功能验证，非零拷贝。</text>
</svg>
