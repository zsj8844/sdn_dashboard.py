<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN IoT 网络监控仪表盘（增强版）</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; margin-bottom: 20px; font-size: 2.5rem; }
        
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 8px; }
        .tab-btn { flex: 1; padding: 12px 20px; background: transparent; border: none; color: #a0aec0; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .top-status-bar { display: flex; justify-content: space-around; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .status-item { text-align: center; }
        .status-item .title { color: #a0aec0; font-size: 14px; margin-bottom: 8px; }
        .status-item .value { font-size: 24px; font-weight: 700; color: #fff; }
        
        .section { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .section h2 { color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
        .card .label { color: #a0aec0; font-size: 14px; margin-bottom: 8px; }
        .card .value { color: #fff; font-size: 20px; font-weight: 600; }
        
        .topology-container { width: 100%; height: 500px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        
        .flows-container, .logs-container, .stats-container { max-height: 400px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; background: rgba(0,0,0,0.2); }
        .flow-item, .log-item, .stat-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; color: #e2e8f0; font-family: 'Courier New', monospace; }
        
        .form-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-input { flex: 1; min-width: 200px; padding: 10px 15px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%); color: white; }
        
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .battery-high { background: linear-gradient(to right, #48bb78, #38a169); }
        .battery-medium { background: linear-gradient(to right, #ecc94b, #d69e2e); }
        .battery-low { background: linear-gradient(to right, #e53e3e, #c53030); }
    </style>
</head>
<body>
    <div class="container">
        <h1>SDN IoT 网络监控仪表盘（增强版）</h1>
        
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('overview', this)">系统概览</button>
            <button class="tab-btn" onclick="switchTab('topology', this)">拓扑可视化</button>
            <button class="tab-btn" onclick="switchTab('flows', this)">流表管理</button>
            <button class="tab-btn" onclick="switchTab('stats', this)">统计数据</button>
            <button class="tab-btn" onclick="switchTab('logs', this)">日志监控</button>
            <button class="tab-btn" onclick="switchTab('apps', this)">边缘应用管理</button>
            <button class="tab-btn" onclick="switchTab('roles', this)">设备角色管理</button>
        </div>
        
        <div class="top-status-bar">
            <div class="status-item">
                <div class="title">交换机在线</div>
                <div class="value" id="switches-online-count">0</div>
            </div>
            <div class="status-item">
                <div class="title">BLE节点在线</div>
                <div class="value" id="ble-nodes-online-count">0</div>
            </div>
            <div class="status-item">
                <div class="title">系统状态</div>
                <div class="value" style="color: #48bb78;" id="system-status">正常</div>
            </div>
            <div class="status-item">
                <div class="title">上次更新</div>
                <div class="value" id="last-update-time">--</div>
            </div>
        </div>
        
        <div id="overview" class="tab-content active">
            <div class="section">
                <h2>系统概览</h2>
                <div class="grid" id="system-overview-container"></div>
            </div>
            <div class="section">
                <h2>控制器与交换机连接状态</h2>
                <div class="grid" id="switches-status-container"></div>
            </div>
            <div class="section">
                <h2>BLE节点状态</h2>
                <div class="grid" id="ble-nodes-container"></div>
            </div>
            <div class="section">
                <h2>IoT扩展字段</h2>
                <div class="grid" id="iot-extension-container"></div>
            </div>
        </div>
        
        <div id="topology" class="tab-content">
            <div class="section">
                <h2>网络拓扑</h2>
                <div class="topology-container" id="topology-svg"></div>
            </div>
            <div class="section">
                <h2>拓扑信息</h2>
                <div class="grid" id="topology-info-container"></div>
            </div>
        </div>
        
        <div id="flows" class="tab-content">
            <div class="section">
                <h2>添加流表</h2>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">交换机:</label>
                        <select class="form-input" id="flow-switch" style="flex: 1;">
                            <option value="1">交换机 s1</option>
                            <option value="2">交换机 s2</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">流表ID:</label>
                        <input type="number" class="form-input" id="flow-table" placeholder="默认0" value="0" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">优先级:</label>
                        <input type="number" class="form-input" id="flow-priority" placeholder="默认10" value="10" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">匹配条件:</label>
                        <input type="text" class="form-input" id="flow-match" placeholder="如: eth_type=0x0800,nw_dst=192.168.1.20" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">动作:</label>
                        <input type="text" class="form-input" id="flow-actions" placeholder="如: output:2" value="output:2" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="addFlow()">添加流表</button>
                    <button class="btn btn-danger" onclick="clearFlows()">清空流表</button>
                </div>
            </div>
            <div class="section">
                <h2>交换机流表（s1）</h2>
                <div class="flows-container" id="s1-flows-container"></div>
            </div>
            <div class="section">
                <h2>交换机流表（s2）</h2>
                <div class="flows-container" id="s2-flows-container"></div>
            </div>
        </div>
        
        <div id="stats" class="tab-content">
            <div class="section">
                <h2>端口统计</h2>
                <div class="stats-container" id="port-stats-container"></div>
            </div>
            <div class="section">
                <h2>流表统计</h2>
                <div class="stats-container" id="flow-stats-container"></div>
            </div>
            <div class="section">
                <h2>流表表统计</h2>
                <div class="stats-container" id="table-stats-container"></div>
            </div>
        </div>
        
        <div id="logs" class="tab-content">
            <div class="section">
                <h2>网关数据传输日志</h2>
                <div class="logs-container" id="gateway-logs-container"></div>
            </div>
            <div class="section">
                <h2>交换机s1数据传输日志</h2>
                <div class="logs-container" id="s1-logs-container"></div>
            </div>
            <div class="section">
                <h2>交换机s2数据传输日志</h2>
                <div class="logs-container" id="s2-logs-container"></div>
            </div>
        </div>
        
        <div id="apps" class="tab-content">
            <div class="section">
                <h2>创建边缘应用</h2>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">应用ID:</label>
                        <input type="text" class="form-input" id="app-id" placeholder="如: app001" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">应用名称:</label>
                        <input type="text" class="form-input" id="app-name" placeholder="应用名称" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">应用类型:</label>
                        <select class="form-input" id="app-type" style="flex: 1;">
                            <option value="1">1 - 数据过滤</option>
                            <option value="2">2 - AI推理</option>
                            <option value="3">3 - 数据聚合</option>
                            <option value="4">4 - 自定义应用</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">版本:</label>
                        <input type="text" class="form-input" id="app-version" placeholder="默认: 1.0.0" value="1.0.0" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                        <label style="color: #a0aec0; white-space: nowrap;">应用代码:</label>
                        <textarea class="form-input" id="app-code" placeholder="输入应用代码" rows="6" style="width: 100%; min-height: 120px;"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="createApp()">创建应用</button>
                    <button class="btn btn-danger" onclick="refreshApps()">刷新列表</button>
                </div>
            </div>
            
            <div class="section">
                <h2>应用列表</h2>
                <div id="apps-list-container"></div>
            </div>
            
            <div class="section" id="app-details-section" style="display: none;">
                <h2>应用详情</h2>
                <div id="app-details-container"></div>
                <div class="form-group" style="margin-top: 20px;">
                    <select class="form-input" id="deploy-device">
                        <option value="iot1">iot1 (温度传感器)</option>
                        <option value="iot2">iot2 (湿度传感器)</option>
                        <option value="iot3">iot3 (网关)</option>
                        <option value="iot4">iot4 (位置传感器)</option>
                    </select>
                    <button class="btn btn-primary" onclick="deployApp()">部署到设备</button>
                    <button class="btn btn-danger" onclick="deleteApp()">删除应用</button>
                </div>
            </div>
        </div>
        
        <div id="roles" class="tab-content">
            <div class="section">
                <h2>注册设备</h2>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">设备ID:</label>
                        <input type="text" class="form-input" id="role-device-id" placeholder="如: dev001" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">设备名称:</label>
                        <input type="text" class="form-input" id="role-device-name" placeholder="设备名称" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">初始模式:</label>
                        <select class="form-input" id="role-initial-mode" style="flex: 1;">
                            <option value="1">1 - 纯转发</option>
                            <option value="2">2 - 计算混合</option>
                            <option value="3">3 - 物联网网关</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">CPU核心数:</label>
                        <input type="number" class="form-input" id="role-cpu-cores" placeholder="CPU核心数" value="1" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">内存(MB):</label>
                        <input type="number" class="form-input" id="role-memory-mb" placeholder="内存(MB)" value="512" style="flex: 1;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">存储(MB):</label>
                        <input type="number" class="form-input" id="role-storage-mb" placeholder="存储(MB)" value="1024" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;">
                        <label style="color: #a0aec0; white-space: nowrap;">网络端口:</label>
                        <input type="number" class="form-input" id="role-network-ports" placeholder="网络端口数" value="2" style="flex: 1;">
                    </div>
                </div>
                <div class="form-group">
                    <label style="color: #a0aec0; margin-right: 15px;">
                        <input type="checkbox" id="role-supports-nat"> 支持NAT
                    </label>
                    <label style="color: #a0aec0; margin-right: 15px;">
                        <input type="checkbox" id="role-supports-container"> 支持容器
                    </label>
                    <label style="color: #a0aec0;">
                        <input type="checkbox" id="role-supports-ble"> 支持BLE
                    </label>
                </div>
                <div class="form-group">
                    <button class="btn btn-primary" onclick="registerDevice()">注册设备</button>
                    <button class="btn btn-danger" onclick="refreshDevices()">刷新列表</button>
                </div>
            </div>
            
            <div class="section">
                <h2>设备列表</h2>
                <div id="devices-list-container"></div>
            </div>
            
            <div class="section" id="device-details-section" style="display: none;">
                <h2>设备详情</h2>
                <div id="device-details-container"></div>
                <div class="section" style="margin-top: 20px;">
                    <h4 style="color: #a0aec0; margin-bottom: 10px;">切换设备角色</h4>
                    <div class="form-group">
                        <select class="form-input" id="target-mode">
                            <option value="1">1 - 纯转发</option>
                            <option value="2">2 - 计算混合</option>
                            <option value="3">3 - 物联网网关</option>
                        </select>
                        <button class="btn btn-primary" onclick="switchDeviceMode()">切换模式</button>
                    </div>
                </div>
                <div class="section" style="margin-top: 20px;">
                    <h4 style="color: #a0aec0; margin-bottom: 10px;">智能推荐</h4>
                    <div class="form-group">
                        <button class="btn btn-primary" onclick="identifyOptimalMode()">识别最优模式</button>
                    </div>
                    <div id="recommendation-container" style="margin-top: 15px;"></div>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <button class="btn btn-danger" onclick="deleteDevice()">删除设备</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentTopology = { switches: [], links: [], hosts: [] };
        let currentStats = { port_stats: {}, flow_stats: {}, table_stats: {} };
        let currentApps = [];
        let selectedAppId = null;
        let currentDevices = [];
        let selectedDeviceId = null;
        
        window.onload = function() {
            fetchData();
            fetchTopology();
            fetchStats();
            fetchApps();
            fetchDevices();
            setInterval(() => {
                fetchData();
                fetchTopology();
                fetchStats();
            }, 3000);
        };
        
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if (tabId === 'topology') {
                setTimeout(renderTopology, 100);
            }
        }
        
        function fetchData() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    currentData = data;
                    updateTopStatus(data);
                    updateSystemOverview(data);
                    updateSwitchesStatus(data.switches_status);
                    updateBleNodes(data.ble_mesh.nodes);
                    updateFlows('s1-flows-container', data.s1_flows);
                    updateFlows('s2-flows-container', data.s2_flows);
                    updateLogs('gateway-logs-container', data.gateway_logs);
                    updateLogs('s1-logs-container', data.s1_logs);
                    updateLogs('s2-logs-container', data.s2_logs);
                    updateIotExtension(data.iot_extension);
                    document.getElementById('last-update-time').textContent = new Date().toLocaleString();
                })
                .catch(err => console.error('获取数据失败:', err));
        }
        
        function fetchTopology() {
            fetch('/api/topology')
                .then(res => res.json())
                .then(data => {
                    currentTopology = data;
                    updateTopologyInfo(data);
                })
                .catch(err => console.error('获取拓扑失败:', err));
        }
        
        function fetchStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    currentStats = data;
                    updateStats(data);
                })
                .catch(err => console.error('获取统计失败:', err));
        }
        
        function updateTopStatus(data) {
            const switchesOnlineCount = Object.values(data.switches_status).filter(status => status.connected).length;
            document.getElementById('switches-online-count').textContent = switchesOnlineCount;
            const bleNodesOnlineCount = data.ble_mesh.nodes.filter(node => node.status === '在线').length;
            document.getElementById('ble-nodes-online-count').textContent = bleNodesOnlineCount;
        }
        
        function updateSystemOverview(data) {
            const container = document.getElementById('system-overview-container');
            const switchesOnlineCount = Object.values(data.switches_status).filter(status => status.connected).length;
            const bleNodesOnlineCount = data.ble_mesh.nodes.filter(node => node.status === '在线').length;
            const totalFlows = (data.s1_flows?.length || 0) + (data.s2_flows?.length || 0);
            const totalLogs = (data.gateway_logs?.length || 0) + (data.s1_logs?.length || 0) + (data.s2_logs?.length || 0);
            
            container.innerHTML = `
                <div class="card">
                    <div class="label">交换机状态</div>
                    <div class="value" style="font-size: 24px; margin: 10px 0;">${switchesOnlineCount}/2 在线</div>
                    <div class="label">运行中: ${switchesOnlineCount}, 离线: ${2 - switchesOnlineCount}</div>
                </div>
                <div class="card">
                    <div class="label">BLE节点状态</div>
                    <div class="value" style="font-size: 24px; margin: 10px 0;">${bleNodesOnlineCount}/${data.ble_mesh.nodes.length} 在线</div>
                    <div class="label">运行中: ${bleNodesOnlineCount}, 离线: ${data.ble_mesh.nodes.length - bleNodesOnlineCount}</div>
                </div>
                <div class="card">
                    <div class="label">流表数量</div>
                    <div class="value" style="font-size: 24px; margin: 10px 0;">${totalFlows}</div>
                    <div class="label">s1: ${data.s1_flows?.length || 0}, s2: ${data.s2_flows?.length || 0}</div>
                </div>
                <div class="card">
                    <div class="label">日志记录</div>
                    <div class="value" style="font-size: 24px; margin: 10px 0;">${totalLogs}</div>
                    <div class="label">网关:${data.gateway_logs?.length || 0} s1:${data.s1_logs?.length || 0} s2:${data.s2_logs?.length || 0}</div>
                </div>
            `;
        }
        
        function updateSwitchesStatus(switchesStatus) {
            const container = document.getElementById('switches-status-container');
            container.innerHTML = Object.entries(switchesStatus).map(([switchName, status]) => {
                const connectedText = status.connected ? '已连接' : '未连接';
                const dpidText = status.dpid ? `DPID: ${status.dpid}` : '无DPID';
                return `
                <div class="card">
                    <div class="label">交换机 ${switchName}</div>
                    <div class="value" style="color: ${status.connected ? '#48bb78' : '#e53e3e'}">${connectedText}</div>
                    <div class="label" style="margin-top: 10px;">${dpidText}</div>
                    <div class="label">

        function renderTopology() {
            const container = document.getElementById('topology-svg');
            container.innerHTML = '';
            
            const width = container.clientWidth;
            const height = 500;
            
            const svg = d3.select('#topology-svg')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            const nodes = [
                { id: 's1', label: 's1', type: 'switch', x: width / 3, y: height / 2 },
                { id: 's2', label: 's2', type: 'switch', x: width * 2 / 3, y: height / 2 },
                { id: 'h1', label: 'h1', type: 'host', x: width / 4, y: height - 100 },
                { id: 'h2', label: 'h2', type: 'host', x: width * 3 / 4, y: height - 100 },
                { id: 'iot3', label: 'iot3\n(网关)', type: 'host', x: width / 2, y: 120 },
                { id: 'iot1', label: 'iot1', type: 'host', x: width / 4, y: 80 },
                { id: 'iot2', label: 'iot2', type: 'host', x: width / 3, y: 60 },
                { id: 'iot4', label: 'iot4', type: 'host', x: width * 2 / 3, y: 80 }
            ];
            
            const links = [
                { source: 's1', target: 's2' },
                { source: 's2', target: 'h1' },
                { source: 's2', target: 'h2' },
                { source: 's1', target: 'iot3' },
                { source: 'iot3', target: 'iot1' },
                { source: 'iot3', target: 'iot2' },
                { source: 'iot3', target: 'iot4' }
            ];
            
            svg.selectAll('.link')
                .data(links)
                .enter()
                .append('line')
                .attr('class', 'link')
                .attr('x1', d => nodes.find(n => n.id === d.source).x)
                .attr('y1', d => nodes.find(n => n.id === d.source).y)
                .attr('x2', d => nodes.find(n => n.id === d.target).x)
                .attr('y2', d => nodes.find(n => n.id === d.target).y)
                .attr('stroke', '#667eea')
                .attr('stroke-width', 2);
            
            const node = svg.selectAll('.node')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node')
                .attr('transform', d => `translate(${d.x}, ${d.y})`);
            
            node.append('circle')
                .attr('r', 25)
                .attr('fill', d => d.type === 'switch' ? '#667eea' : '#48bb78')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            node.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', 5)
                .attr('fill', '#fff')
                .attr('font-weight', 'bold')
                .text(d => d.label);
        }

        function createApp() {
            const appId = document.getElementById('app-id').value.trim();
            const appName = document.getElementById('app-name').value.trim();
            const appType = parseInt(document.getElementById('app-type').value);
            const appVersion = document.getElementById('app-version').value.trim() || '1.0.0';
            const appCode = document.getElementById('app-code').value.trim();
            
            if (!appId || !appName || !appCode) {
                alert('请填写完整的应用信息');
                return;
            }
            
            fetch('/api/apps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    app_id: appId,
                    app_name: appName,
                    app_type: appType,
                    app_code: appCode,
                    version: appVersion
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('应用创建成功！');
                    document.getElementById('app-id').value = '';
                    document.getElementById('app-name').value = '';
                    document.getElementById('app-code').value = '';
                    fetchApps();
                } else {
                    alert('创建失败: ' + data.message);
                }
            })
            .catch(err => alert('创建失败: ' + err));
        }

            if (!selectedAppId) {
                alert('请先选择一个应用');
                return;
            }
            
            const deviceId = document.getElementById('deploy-device').value;
            
            fetch(`/api/apps/${selectedAppId}/deploy`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: deviceId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(`应用已部署到 ${deviceId}！`);
                    fetchApps();
                    selectApp(selectedAppId);
                } else {
                    alert('部署失败: ' + data.message);

            .catch(err => alert('部署失败: ' + err));
        }

        function registerDevice() {
            const deviceId = document.getElementById('role-device-id').value.trim();
            const deviceName = document.getElementById('role-device-name').value.trim();
            const initialMode = parseInt(document.getElementById('role-initial-mode').value);
            const cpuCores = parseInt(document.getElementById('role-cpu-cores').value) || 1;
            const memoryMb = parseInt(document.getElementById('role-memory-mb').value) || 512;
            const storageMb = parseInt(document.getElementById('role-storage-mb').value) || 1024;
            const networkPorts = parseInt(document.getElementById('role-network-ports').value) || 2;
            const supportsNat = document.getElementById('role-supports-nat').checked;
            const supportsContainer = document.getElementById('role-supports-container').checked;
            const supportsBle = document.getElementById('role-supports-ble').checked;
            
            if (!deviceId || !deviceName) {
                alert('请填写完整的设备信息');
                return;
            }
            
            fetch('/api/devices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    device_id: deviceId,
                    device_name: deviceName,
                    initial_mode: initialMode,
                    capabilities: {
                        cpu_cores: cpuCores,
                        memory_mb: memoryMb,
                        storage_mb: storageMb,
                        network_ports: networkPorts,
                        supports_nat: supportsNat,
                        supports_container: supportsContainer,
                        supports_ble: supportsBle
                    }
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('设备注册成功！');
                    document.getElementById('role-device-id').value = '';
                    document.getElementById('role-device-name').value = '';
                    fetchDevices();
                } else {
                    alert('注册失败: ' + data.message);
                }

            .catch(err => alert('注册失败: ' + err));
        }

            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('设备模式切换成功！');
                    fetchDevices();
                    selectDevice(selectedDeviceId);
                } else {
                    alert('切换失败: ' + data.message);
                }
            })
            .catch(err => alert('切换失败: ' + err));
        }
        
        function identifyOptimalMode() {
            if (!selectedDeviceId) {
                alert('请先选择一个设备');
                return;
            }
            
            fetch(`/api/devices/${selectedDeviceId}/identify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    traffic_pattern: { iot_traffic_ratio: 30 },
                    resource_usage: { cpu_usage: 50, memory_usage: 60 }
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const modeNames = {1: '纯转发', 2: '计算混合', 3: '物联网网关'};
                    const container = document.getElementById('recommendation-container');
                    container.innerHTML = `
                        <div class="card" style="background: rgba(72, 187, 120, 0.2);">
                            <div class="label">推荐最优模式</div>
                            <div class="value" style="color: #48bb78;">${modeNames[data.identified_mode]}</div>
                            <div class="label" style="margin-top: 10px;">可用模式</div>
                            <div class="value" style="color: #a0aec0; font-size: 14px;">
                                ${data.available_mode_names.join(', ') || '无'}
                            </div>
                        </div>
                    `;
                } else {
                    alert('识别失败: ' + data.message);
                }
            })
            .catch(err => alert('识别失败: ' + err));
        }
        
        function deleteDevice() {
            if (!selectedDeviceId) {
                alert('请先选择一个设备');
                return;
            }
            
            if (!confirm(`确定要删除设备 ${selectedDeviceId} 吗？此操作不可恢复！`)) return;
            
            fetch(`/api/devices/${selectedDeviceId}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('设备已删除！');
                    selectedDeviceId = null;
                    document.getElementById('device-details-section').style.display = 'none';
                    fetchDevices();
                } else {
                    alert('删除失败: ' + data.message);
                }
            })
            .catch(err => alert('删除失败: ' + err));
        }

        function updateIotExtension(extensionData) {
            const container = document.getElementById('iot-extension-container');
            if (!extensionData || Object.keys(extensionData).length === 0) {
                container.innerHTML = '<div class="card"><div class="label">暂无扩展字段数据</div></div>';
                return;
            }
            
            const sensorTypeNames = {
                1: '温度传感器',
                2: '湿度传感器',
                3: '光照传感器',
                4: '运动传感器',
                5: '压力传感器'
            };
            
            const routeSelectNames = {
                1: '路由A',
                2: '路由B'
            };
            
            let html = '';
            
            if (extensionData.sensor_type !== undefined) {
                const sensorName = sensorTypeNames[extensionData.sensor_type] || '未知';
                html += `
                    <div class="card">
                        <div class="label">传感器类型</div>
                        <div class="value">${sensorName} (${extensionData.sensor_type})</div>
                    </div>
                `;
            }
            
            if (extensionData.device_priority !== undefined) {
                html += `
                    <div class="card">
                        <div class="label">设备优先级</div>
                        <div class="value">${extensionData.device_priority}</div>
                    </div>
                `;
            }
            
            if (extensionData.route_select !== undefined) {
                const routeName = routeSelectNames[extensionData.route_select] || '未知';
                html += `
                    <div class="card">
                        <div class="label">路由选择</div>
                        <div class="value">${routeName} (${extensionData.route_select})</div>
                    </div>
                `;
            }
            
            if (extensionData.timestamp) {
                html += `
                    <div class="card">
                        <div class="label">更新时间</div>
                        <div class="value">${new Date(extensionData.timestamp * 1000).toLocaleString()}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html || '<div class="card"><div class="label">暂无扩展字段数据</div></div>';
        }
    </script>
</body>
</html>
